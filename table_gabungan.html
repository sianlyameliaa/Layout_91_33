<!DOCTYPE html>
<html>
    <head>
        <title>Table Gabungan</title>
        <link rel="stylesheet" href="table_gabungan.css">
    </head>
    <body>
        <!-- rowspan: menggabungkan baris

                <th rowspan="2">Mata Pelajaran</th>
                <th colspan="2">Nilai</th>
            </tr>
            <tr>
                <th>Ulangan 1</th>
                <th>Ulangan 2</th>
            </tr>
            <tr>
                <td>1</td>

                <td>Matematika</td>

                <td class="merah">2</td>

                <td>2</td>
                <td>Clarissa</td>
                <td>Matematika</td>
                <td>97</td>
                <td>94</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Sianly</td>
                <td>Matematika</td>
                <td>100</td>
                <td>100</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Taraya</td>
                <td>Matematika</td>
                <td>80</td>
                <td class="merah">70</td>
            </tr>

                <td>5</td>

                <td class="merah">65</td>
            </tr>
        </table>
    </body>
</html>
